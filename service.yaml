apiVersion: v1
kind: Service
metadata:
  name: my-app-service  # Name of the service
  labels:
    app: my-app         # Label to match the deployment
spec:
  type: NodePort        # Type of service (NodePort, ClusterIP, LoadBalancer)
  ports:
    - port: 8080        # Port that the service will expose
      targetPort: 8080  # Port on the container that the service will forward to
      nodePort: 30000   # Optional: specify a port for NodePort (between 30000-32767)
  selector:
    app: my-app         # Selector to match the pods
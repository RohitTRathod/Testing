# k8s/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort  # Expose the service on a port on each node
  ports:
    - port: 8080  # Port that the service will expose
      targetPort: 8080  # Port on the container
      nodePort: 30001  # Port to access the service externally (optional)
  selector:
    app: my-app  # Must match the labels of the Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test  # Changed to your desired deployment name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test  # Changed to your desired app label
  template:
    metadata:
      labels:
        app: test  # Changed to your desired app label
    spec:
      containers:
      - name: test-container  # Changed to your desired container name
        image: rohittrathod/pretest:latest  # Change this to your Docker Hub image
        ports:
        - containerPort: 8080